[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-slack-thread-assignee"
version = "0.1.0"
description = "Stateless contextual Slack recipient routing through Jev for Hermes"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "u1-liquid"}]


[project.entry-points."hermes_agent.plugins"]
slack-thread-assignee = "hermes_slack_thread_assignee:register"

[tool.setuptools.package-data]
hermes_slack_thread_assignee = ["plugin.yaml"]

[tool.setuptools.packages.find]
include = ["hermes_slack_thread_assignee*"]

[tool.ruff]
line-length = 110
